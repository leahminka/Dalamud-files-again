name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build InventoryDiscardAssistant/InventoryDiscardAssistant.csproj --configuration Release
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: InventoryDiscardAssistant-build
          path: |
            dist/**
            InventoryDiscardAssistant/bin/Release/**
