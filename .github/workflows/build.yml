name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download current Dalamud API 15 dev build
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip
      - name: Build
        run: dotnet build InventoryDiscardAssistant/InventoryDiscardAssistant.csproj --configuration Release
      - name: Copy packaged plugin ZIP
        shell: pwsh
        run: |
          $package = "InventoryDiscardAssistant/bin/Release/InventoryDiscardAssistant/latest.zip"
          if (!(Test-Path $package)) { throw "DalamudPackager output not found: $package" }
          Copy-Item $package "InventoryDiscardAssistant.zip" -Force
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: InventoryDiscardAssistant-build
          path: InventoryDiscardAssistant.zip
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.13
          name: Inventory Discard Assistant v0.1.13
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: InventoryDiscardAssistant.zip
